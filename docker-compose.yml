#
# start fado server in docker container
#
services:
  fado-srv:
    image: debian:latest
    command: "/bin/bash /var/www/html/docker/start.sh"
    user: root
    environment:
      ROOT: "/var/www/html"
    ports:
      - 2080:2080
      - 2443:2443
#      - 80:80
#      - 443:443
    volumes:
      - ./:/var/www/html
#      - ../ssl:/var/www/ssl

